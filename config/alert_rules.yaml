alerts:
  - name: HighLatencyAlert
    severity: Critical
    condition: "P95 latency > 3000ms"
    duration: "5m"
    type: symptom-based
    channel: slack
    owner: SRE Team
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRateAlert
    severity: Critical
    condition: "Error rate > 2%"
    duration: "2m"
    type: symptom-based
    channel: slack
    owner: SRE Team
    runbook: docs/alerts.md#alert-2
  - name: LowQualityScoreAlert
    severity: Warning
    condition: "Quality score < 0.75"
    duration: "10m"
    type: symptom-based
    channel: slack
    owner: AI Team
    runbook: docs/alerts.md#alert-3
